<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
  canvas { background: linear-gradient(#0a0e1a, #16203a); border: 2px solid #2a3a5a; }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- input ----
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
addEventListener('keyup', e => keys[e.key] = false);
let mouse = { x: W / 2, y: H - 80 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('click', () => { if (state === 'menu' || state === 'over') start(); });

// ---- game state ----
let state = 'menu'; // menu | playing | over
let score = 0, level = 1, killsThisLevel = 0, killsNeeded = 8;
let shake = 0;

const player = { x: W / 2, y: H - 70, w: 34, h: 34, speed: 260, hp: 3, maxHp: 3,
  fireCd: 0, fireRate: 0.22, weapon: 'single', weaponT: 0, shieldT: 0, rapidT: 0 };

let bullets = [], enemies = [], eBullets = [], powerups = [], particles = [], boss = null;

function start() {
  state = 'playing'; score = 0; level = 1; killsThisLevel = 0; killsNeeded = 8;
  player.x = W / 2; player.y = H - 70; player.hp = player.maxHp;
  player.weapon = 'single'; player.weaponT = 0; player.shieldT = 0; player.rapidT = 0;
  bullets = []; enemies = []; eBullets = []; powerups = []; particles = []; boss = null;
}

// ---- spawn ----
let spawnT = 0;
function spawnWave(dt) {
  if (boss) return;
  spawnT -= dt;
  if (spawnT > 0) return;
  spawnT = Math.max(0.5, 1.6 - level * 0.08);
  // ponytail: 1/3 chance of a circular flier once level 2+
  const circling = level >= 2 && Math.random() < 0.35;
  const x = 30 + Math.random() * (W - 60);
  if (circling) {
    enemies.push({ type: 'circle', x, y: -30, w: 30, h: 30, hp: 2 + level, maxHp: 2 + level,
      cx: Math.max(80, Math.min(W - 80, x + (Math.random() < 0.5 ? -110 : 110))), cy: 90 + Math.random() * 140,
      r: 70 + Math.random() * 50, ang: Math.random() * Math.PI * 2, spd: (Math.random() < 0.5 ? -1 : 1) * (0.7 + level * 0.05),
      shootT: 1.5, score: 30 });
  } else {
    enemies.push({ type: 'straight', x, y: -30, w: 28, h: 28, hp: 1 + Math.floor(level / 2), maxHp: 1 + Math.floor(level / 2),
      vy: 70 + level * 6, sway: Math.random() * Math.PI * 2, shootT: 1.8 + Math.random(), score: 10 });
  }
}

function spawnBoss() {
  boss = { x: W / 2, y: -80, w: 110, h: 80, hp: 40 + level * 15, maxHp: 40 + level * 15,
    t: 0, dir: 1, shootT: 1, burstT: 2.5 };
}

// ---- powerups ----
const PU_TYPES = ['spread', 'laser', 'shield', 'rapid', 'heal', 'bomb'];
function maybeDropPowerup(x, y) {
  if (Math.random() > 0.18) return;
  powerups.push({ x, y, r: 12, type: PU_TYPES[(Math.random() * PU_TYPES.length) | 0], vy: 60, t: 0 });
}
function applyPowerup(p) {
  switch (p.type) {
    case 'spread': player.weapon = 'spread'; player.weaponT = 12; break;
    case 'laser':  player.weapon = 'laser';  player.weaponT = 10; break;
    case 'shield': player.shieldT = 8; break;
    case 'rapid':  player.rapidT = 8; break;
    case 'heal':   player.hp = Math.min(player.maxHp, player.hp + 1); break;
    case 'bomb':   eBullets = []; enemies.forEach(e => e.hp -= 3); if (boss) boss.hp -= 15; shake = 0.4; break;
  }
  addParticles(p.x, p.y, '#7ff', 12);
}

// ---- shooting ----
function playerShoot() {
  const rate = player.rapidT > 0 ? player.fireRate * 0.5 : player.fireRate;
  player.fireCd = rate;
  const b = (ox, vx, w = 4, h = 12, dmg = 1, laser = false) =>
    bullets.push({ x: player.x + ox, y: player.y - 16, vx, vy: laser ? -700 : -460, w, h, dmg, laser });
  if (player.weapon === 'spread') {
    b(-10, -80); b(0, 0); b(10, 80);
    b(-6, -180, 3, 9); b(6, 180, 3, 9);
  } else if (player.weapon === 'laser') {
    b(0, 0, 8, 26, 2, true);
  } else {
    b(-9, -30); b(9, 30);
  }
}

function enemyShoot(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const spd = 170 + level * 8;
  eBullets.push({ x: e.x, y: e.y, vx: dx / d * spd, vy: dy / d * spd, r: 5 });
}
function bossShoot(b) {
  // aimed shot + spread ring at higher levels
  const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy) || 1;
  const spd = 190;
  eBullets.push({ x: b.x, y: b.y + 30, vx: dx / d * spd, vy: dy / d * spd, r: 6 });
  if (level >= 10) {
    for (let i = -2; i <= 2; i++) {
      const a = Math.atan2(dy, dx) + i * 0.25;
      eBullets.push({ x: b.x, y: b.y + 30, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 5 });
    }
  }
}

// ---- particles ----
function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.4 + Math.random() * 0.4, color });
  }
}

// ---- update ----
function update(dt) {
  // player move (arrows/WASD or mouse)
  let mx = 0, my = 0;
  if (keys['ArrowLeft'] || keys['a']) mx -= 1;
  if (keys['ArrowRight'] || keys['d']) mx += 1;
  if (keys['ArrowUp'] || keys['w']) my -= 1;
  if (keys['ArrowDown'] || keys['s']) my += 1;
  if (mx || my) {
    const d = Math.hypot(mx, my);
    player.x += mx / d * player.speed * dt;
    player.y += my / d * player.speed * dt;
  } else if (mouse.x) {
    // mouse steering when moved recently
    player.x += (mouse.x - player.x) * Math.min(1, dt * 10);
    player.y += (mouse.y - player.y) * Math.min(1, dt * 10);
  }
  player.x = Math.max(16, Math.min(W - 16, player.x));
  player.y = Math.max(30, Math.min(H - 20, player.y));

  if (player.weaponT > 0) { player.weaponT -= dt; if (player.weaponT <= 0) player.weapon = 'single'; }
  if (player.shieldT > 0) player.shieldT -= dt;
  if (player.rapidT > 0) player.rapidT -= dt;

  player.fireCd -= dt;
  if (player.fireCd <= 0 && (keys[' '] || true)) playerShoot();

  // bullets
  bullets = bullets.filter(b => { b.x += b.vx * dt; b.y += b.vy * dt; return b.y > -30 && b.x > -20 && b.x < W + 20; });
  eBullets = eBullets.filter(b => { b.x += b.vx * dt; b.y += b.vy * dt; return b.y < H + 30 && b.y > -30 && b.x > -30 && b.x < W + 30; });

  // spawn
  if (!boss && killsThisLevel >= killsNeeded) {
    spawnBoss(); // ponytail: boss replaces wave spawn until defeated
  }
  spawnWave(dt);

  // enemies
  enemies = enemies.filter(e => {
    if (e.type === 'circle') {
      if (e.y < e.cy && e.ang === undefined) {} // enter phase handled below
      if (Math.hypot(e.x - e.cx, e.y - e.cy) > e.r + 5 && !e.entered) {
        // fly toward circle start point
        const a = e.ang, tx = e.cx + Math.cos(a) * e.r, ty = e.cy + Math.sin(a) * e.r;
        e.x += (tx - e.x) * Math.min(1, dt * 2);
        e.y += (ty - e.y) * Math.min(1, dt * 2);
        if (Math.hypot(tx - e.x, ty - e.y) < 4) e.entered = true;
      } else {
        e.entered = true;
        e.ang += e.spd * dt;
        e.x = e.cx + Math.cos(e.ang) * e.r;
        e.y = e.cy + Math.sin(e.ang) * e.r;
      }
      e.shootT -= dt;
      if (e.shootT <= 0 && e.y > 20) { e.shootT = 2.2 - Math.min(1.2, level * 0.07); enemyShoot(e); }
    } else {
      e.y += e.vy * dt;
      e.sway += dt * 3;
      e.x += Math.sin(e.sway) * 40 * dt;
      e.shootT -= dt;
      if (e.shootT <= 0 && e.y > 20 && e.y < H * 0.6) { e.shootT = 2.5 - Math.min(1.5, level * 0.08); enemyShoot(e); }
    }
    return e.y < H + 40 && e.hp > 0;
  });

  // boss
  if (boss) {
    boss.t += dt;
    if (boss.y < 90) boss.y += 60 * dt;
    else {
      boss.x += boss.dir * (50 + level) * dt;
      if (boss.x > W - 70 || boss.x < 70) boss.dir *= -1;
      boss.shootT -= dt; boss.burstT -= dt;
      if (boss.shootT <= 0) { boss.shootT = 1.1; bossShoot(boss); }
      if (boss.burstT <= 0) { boss.burstT = 3.2; // radial burst
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2;
          eBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, r: 5 }); } }
    }
    if (boss.hp <= 0) { addParticles(boss.x, boss.y, '#f80', 50); shake = 0.6;
      score += 500 + level * 100; boss = null;
      level++; killsThisLevel = 0; killsNeeded = 8 + level * 2;
      maybeDropPowerup(player.x, player.y - 40); }
  }

  // collisions: player bullets vs enemies/boss
  bullets = bullets.filter(b => {
    for (const e of enemies) {
      if (Math.abs(b.x - e.x) < e.w / 2 + b.w / 2 && Math.abs(b.y - e.y) < e.h / 2 + b.h / 2) {
        e.hp -= b.dmg; addParticles(b.x, b.y, '#fc4', 3);
        if (e.hp <= 0) { score += e.score; killsThisLevel++; addParticles(e.x, e.y, '#f66', 14); maybeDropPowerup(e.x, e.y); }
        return false;
      }
    }
    if (boss && Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
      boss.hp -= b.dmg; addParticles(b.x, b.y, '#fc4', 3); return false;
    }
    return true;
  });
  enemies = enemies.filter(e => e.hp > 0);

  // enemy bullets vs player
  if (player.shieldT <= 0) {
    eBullets = eBullets.filter(b => {
      if (Math.hypot(b.x - player.x, b.y - player.y) < 16 + b.r) {
        hurt(); return false;
      }
      return true;
    });
    // body collision
    for (const e of enemies) {
      if (Math.hypot(e.x - player.x, e.y - player.y) < 24) { hurt(); e.hp = 0; addParticles(e.x, e.y, '#f66', 14); }
    }
    if (boss && Math.abs(boss.x - player.x) < boss.w / 2 && Math.abs(boss.y - player.y) < boss.h / 2 + 10) hurt();
  }

  // powerups
  powerups = powerups.filter(p => {
    p.y += p.vy * dt; p.t += dt;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 26) { applyPowerup(p); return false; }
    return p.y < H + 20;
  });

  // particles
  particles = particles.filter(p => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; return p.t > 0; });

  if (shake > 0) shake -= dt;
}

function hurt() {
  player.hp--;
  shake = 0.35;
  addParticles(player.x, player.y, '#4af', 20);
  if (player.hp <= 0) { state = 'over'; addParticles(player.x, player.y, '#fff', 40); }
}

// ---- draw ----
function drawPlane(x, y, w, h, color, flip = false) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.rotate(Math.PI);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2); ctx.lineTo(w / 2 - 4, h / 2); ctx.lineTo(0, h / 4);
  ctx.lineTo(-w / 2 + 4, h / 2); ctx.closePath(); ctx.fill();
  ctx.fillRect(-w / 4 - 4, h / 6, w / 2 + 8, 4); // wings bar
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
  ctx.clearRect(-10, -10, W + 20, H + 20);

  if (state === 'menu') {
    ctx.fillStyle = '#8af'; ctx.font = 'bold 34px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SKY SHOOTER', W / 2, H / 2 - 60);
    ctx.fillStyle = '#567'; ctx.font = '14px monospace';
    ctx.fillText('Arrows / WASD / mouse to move', W / 2, H / 2);
    ctx.fillText('Boss every 5 levels • grab power-ups', W / 2, H / 2 + 24);
    ctx.fillStyle = '#fff'; ctx.fillText('CLICK TO START', W / 2, H / 2 + 70);
    ctx.restore(); return;
  }

  if (state === 'over') {
    ctx.fillStyle = '#f66'; ctx.font = 'bold 34px monospace'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff'; ctx.font = '18px monospace';
    ctx.fillText('Score: ' + score + '   Level: ' + level, W / 2, H / 2 + 4);
    ctx.fillStyle = '#8af'; ctx.font = '14px monospace';
    ctx.fillText('CLICK TO RESTART', W / 2, H / 2 + 50);
    ctx.restore(); return;
  }

  // powerups
  const PU_COLORS = { spread: '#f80', laser: '#f44', shield: '#4af', rapid: '#ff4', heal: '#4f8', bomb: '#fff' };
  for (const p of powerups) {
    ctx.fillStyle = PU_COLORS[p.type];
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 3);
    ctx.fillRect(-9, -9, 18, 18); ctx.restore();
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.type[0].toUpperCase(), p.x, p.y + 4);
  }

  // bullets
  ctx.fillStyle = '#ff6';
  for (const b of bullets) { ctx.fillStyle = b.laser ? '#f4f' : '#ff6'; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h); }
  ctx.fillStyle = '#f44';
  for (const b of eBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }

  // enemies
  for (const e of enemies) drawPlane(e.x, e.y, e.w, e.h, e.type === 'circle' ? '#c6f' : '#f55', true);

  // boss
  if (boss) {
    drawPlane(boss.x, boss.y, boss.w, boss.h, '#d43', true);
    ctx.fillStyle = '#300'; ctx.fillRect(boss.x - 55, boss.y - 60, 110, 8);
    ctx.fillStyle = '#f44'; ctx.fillRect(boss.x - 55, boss.y - 60, 110 * Math.max(0, boss.hp / boss.maxHp), 8);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('BOSS — LV ' + level, boss.x, boss.y - 66);
  }

  // player
  drawPlane(player.x, player.y, player.w, player.h, '#4cf');
  if (player.shieldT > 0) {
    ctx.strokeStyle = 'rgba(80,180,255,' + (0.4 + 0.3 * Math.sin(performance.now() / 120)) + ')';
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, 7); ctx.stroke();
  }

  // particles
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.t * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left'; ctx.font = '14px monospace';
  ctx.fillStyle = '#fff'; ctx.fillText('SCORE ' + score, 10, 20);
  ctx.fillText('LV ' + level, 10, 40);
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#f44' : '#444';
    ctx.fillRect(W - 20 - i * 18, 10, 14, 10);
  }
  const buffs = [];
  if (player.weapon !== 'single') buffs.push(player.weapon.toUpperCase() + ' ' + Math.ceil(player.weaponT) + 's');
  if (player.shieldT > 0) buffs.push('SHIELD ' + Math.ceil(player.shieldT) + 's');
  if (player.rapidT > 0) buffs.push('RAPID ' + Math.ceil(player.rapidT) + 's');
  if (buffs.length) { ctx.fillStyle = '#8f8'; ctx.fillText(buffs.join('  '), 10, H - 12); }
  if (!boss) {
    ctx.fillStyle = '#567'; ctx.textAlign = 'center';
    ctx.fillText('kills ' + killsThisLevel + '/' + killsNeeded + ' → BOSS at level ' + (level % 5 === 0 ? level : (level - level % 5 + 5)), W / 2, 20);
  }
  ctx.restore();
}

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05); lastTime = ts;
  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(t => { lastTime = t; loop(t); });
</script>
</body>
</html>
